server:
  port: 8089

spring:
  application:
    name: orchestrator-service
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:mysql://localhost:3306/orchestrator_service}
    username: ${ORCHESTRATOR_DB_USERNAME:orchestrator_service}
    password: ${ORCHESTRATOR_DB_PASSWORD:orchestrator_service}
  jpa:
    hibernate:
      ddl-auto: ${ORCHESTRATOR_DB_DDL_AUTO:create}
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  provider-service:
    base-url: ${PROVIDER_SERVICE_BASE_URL:http://localhost:8088}
  contract-service:
    base-url: ${CONTRACT_SERVICE_BASE_URL:http://localhost:8086}
  kafka:
    topics:
      operations-succeeded: operations.succeeded
      operations-failed: operations.failed
  scheduler:
    pending:
      fixed-delay-ms: ${PENDING_OPERATION_SCHEDULER_DELAY_MS:5000}
      batch-size: ${PENDING_OPERATION_BATCH_SIZE:10}
      worker-threads: ${PROVISIONING_WORKER_THREADS:10}
    polling:
      fixed-delay-ms: ${WAITING_OPERATION_SCHEDULER_DELAY_MS:2000}
      batch-size: ${WAITING_OPERATION_BATCH_SIZE:50}
      worker-threads: ${POLLING_WORKER_THREADS:20}
  provisioning:
    poll-interval-seconds: ${VM_POLL_INTERVAL_SECONDS:20}
    build-timeout-seconds: ${VM_BUILD_TIMEOUT_SECONDS:900}
  provider-session:
    token-lifetime-seconds: ${PROVIDER_TOKEN_LIFETIME_SECONDS:300}
    refresh-before-expiry-seconds: ${PROVIDER_TOKEN_REFRESH_WINDOW_SECONDS:30}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:local-development-token-encryption-key-change-me}
  huawei-token:
    token-lifetime-seconds: ${HUAWEI_TOKEN_LIFETIME_SECONDS:7200}
    refresh-before-expiry-seconds: ${HUAWEI_TOKEN_REFRESH_WINDOW_SECONDS:600}
    refresh-cron: ${HUAWEI_TOKEN_REFRESH_CRON:0 0 * * * *}
  mock-provider-credentials:
    vmware:
      username: ${MOCK_VMWARE_USERNAME:administrator@vsphere.local}
      password: ${MOCK_VMWARE_PASSWORD:vmware-demo-secret}

server:
  port: 8089

spring:
  application:
    name: orchestrator-service
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:mysql://localhost:3306/orchestrator_service}
    username: ${ORCHESTRATOR_DB_USERNAME:orchestrator_service}
    password: ${ORCHESTRATOR_DB_PASSWORD:orchestrator_service}
  jpa:
    hibernate:
      ddl-auto: ${ORCHESTRATOR_DB_DDL_AUTO:create}
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  provider-service:
    base-url: ${PROVIDER_SERVICE_BASE_URL:http://localhost:8088}
  contract-service:
    base-url: ${CONTRACT_SERVICE_BASE_URL:http://localhost:8086}
  kafka:
    topics:
      operations-succeeded: operations.succeeded
      operations-failed: operations.failed
  scheduler:
    fixed-delay-ms: ${OPERATION_SCHEDULER_FIXED_DELAY_MS:5000}
    batch-size: ${OPERATION_SCHEDULER_BATCH_SIZE:10}
    worker-threads: ${OPERATION_SCHEDULER_WORKER_THREADS:10}
  provisioning:
    poll-interval-seconds: ${VM_POLL_INTERVAL_SECONDS:5}
    build-timeout-seconds: ${VM_BUILD_TIMEOUT_SECONDS:900}
  mock-provider-credentials:
    openstack:
      username: ${MOCK_OPENSTACK_USERNAME:openstack-admin}
      password: ${MOCK_OPENSTACK_PASSWORD:openstack-demo-secret}
    vmware:
      username: ${MOCK_VMWARE_USERNAME:administrator@vsphere.local}
      password: ${MOCK_VMWARE_PASSWORD:vmware-demo-secret}
    huawei:
      username: ${MOCK_HUAWEI_USERNAME:huawei-admin}
      password: ${MOCK_HUAWEI_PASSWORD:huawei-demo-secret}

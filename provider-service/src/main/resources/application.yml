server:
  port: 8088

spring:
  application:
    name: provider-service
  datasource:
    url: ${PROVIDER_DB_URL:jdbc:mysql://localhost:3306/provider_service}
    username: ${PROVIDER_DB_USERNAME:provider_service}
    password: ${PROVIDER_DB_PASSWORD:provider_service}
  jpa:
    hibernate:
      ddl-auto: ${PROVIDER_DB_DDL_AUTO:create}
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
